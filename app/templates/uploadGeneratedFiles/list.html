<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据列表查看</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#3B82F6",
              secondary: "#64748B",
            },
            borderRadius: {
              none: "0px",
              sm: "2px",
              DEFAULT: "4px",
              md: "8px",
              lg: "12px",
              xl: "16px",
              "2xl": "20px",
              "3xl": "24px",
              full: "9999px",
              button: "4px",
            },
          },
        },
      };
    </script>
    <style>
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .custom-select {
        appearance: none;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
        background-position: right 0.5rem center;
        background-repeat: no-repeat;
        background-size: 1.5em 1.5em;
      }
      
      /* 表格固定列样式 */
      .table-wrapper {
        position: relative;
        overflow: hidden;
      }
      
      .table-scroll {
        overflow-x: auto;
        overflow-y: visible;
      }
      
      .fixed-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }
      
      .fixed-table th,
      .fixed-table td {
        white-space: nowrap;
        padding: 12px 16px;
      }
      
      /* 固定首列（多选框） */
      .fixed-table th:first-child,
      .fixed-table td:first-child {
        position: sticky;
        left: 0;
        z-index: 10;
        background: white;
        box-shadow: 2px 0 4px rgba(0,0,0,0.05);
      }
      
      .fixed-table thead th:first-child {
        background: #f9fafb;
        z-index: 11;
      }
      
      /* 固定最后一列（操作） */
      .fixed-table th:last-child,
      .fixed-table td:last-child {
        position: sticky;
        right: 0;
        z-index: 10;
        background: white;
        box-shadow: -2px 0 4px rgba(0,0,0,0.05);
      }
      
      .fixed-table thead th:last-child {
        background: #f9fafb;
        z-index: 11;
      }
      
      /* 表头样式 */
      .fixed-table thead th {
        background: #f9fafb;
        position: sticky;
        top: 0;
        z-index: 9;
      }
      
      /* 悬停效果 */
      .fixed-table tbody tr:hover td {
        background: #f9fafb;
      }
      
      .fixed-table tbody tr:hover td:first-child,
      .fixed-table tbody tr:hover td:last-child {
        background: #f3f4f6;
      }
    </style>
  </head>
  <body class="min-h-[1024px] bg-gray-50">
    {% set active_page = 'list' %}
    {% include 'uploadGeneratedFiles/navbar.html' %}
    
    <div class="max-w-[1680px] mx-auto px-8 py-6">
      <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
        <div class="flex items-center justify-between mb-6">
          <h1 class="text-2xl font-bold text-gray-900">数据列表查看</h1>
          <button
            id="toggleFilterBtn"
            class="flex items-center px-4 py-2 text-sm text-gray-600 hover:text-primary transition-colors !rounded-button whitespace-nowrap border border-gray-300 hover:bg-gray-50"
          >
            <i class="fas fa-filter mr-2"></i>筛选条件
          </button>
        </div>

        <!-- 筛选条件区域 -->
        <div id="filterSection" class="mb-6 hidden">
          <div class="grid grid-cols-4 gap-4 mb-4">
          <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">使用模板</label>
              <select id="filter_template" class="w-full px-4 py-2 bg-white border border-gray-300 text-gray-900 text-sm !rounded-button custom-select focus:border-primary focus:ring-1 focus:ring-primary">
                <option value="">全部</option>
              </select>
            </div>

            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">店铺类型</label>
              <select id="filter_store_type" class="w-full px-4 py-2 bg-white border border-gray-300 text-gray-900 text-sm !rounded-button custom-select focus:border-primary focus:ring-1 focus:ring-primary">
                <option value="">全部</option>
              </select>
          </div>

          <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">授权主体</label>
              <select id="filter_entity" class="w-full px-4 py-2 bg-white border border-gray-300 text-gray-900 text-sm !rounded-button custom-select focus:border-primary focus:ring-1 focus:ring-primary">
                <option value="">全部</option>
              </select>
          </div>

          <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">授权平台</label>
              <select id="filter_platform" class="w-full px-4 py-2 bg-white border border-gray-300 text-gray-900 text-sm !rounded-button custom-select focus:border-primary focus:ring-1 focus:ring-primary">
                <option value="">全部</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-4 gap-4 mb-4">
          <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">授权品牌</label>
              <select id="filter_brand" class="w-full px-4 py-2 bg-white border border-gray-300 text-gray-900 text-sm !rounded-button custom-select focus:border-primary focus:ring-1 focus:ring-primary">
                <option value="">全部</option>
              </select>
        </div>

          <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">店铺名称</label>
              <input
                id="filter_store_name"
                type="text"
                class="w-full px-4 py-2 bg-white border border-gray-300 text-gray-900 text-sm !rounded-button focus:border-primary focus:ring-1 focus:ring-primary"
                placeholder="请输入店铺名称"
              />
          </div>

          <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">授权字号</label>
            <input
                id="filter_auth_number"
              type="text"
              class="w-full px-4 py-2 bg-white border border-gray-300 text-gray-900 text-sm !rounded-button focus:border-primary focus:ring-1 focus:ring-primary"
              placeholder="请输入授权字号"
            />
          </div>

          <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">授权方（盖章）主体</label>
              <select id="filter_stamping_entity" class="w-full px-4 py-2 bg-white border border-gray-300 text-gray-900 text-sm !rounded-button custom-select focus:border-primary focus:ring-1 focus:ring-primary">
                <option value="">全部</option>
              </select>
          </div>
        </div>

        <div class="flex justify-end space-x-4">
          <button
              id="resetBtn"
            class="px-6 py-2 bg-white border border-gray-300 text-gray-700 text-sm font-medium !rounded-button hover:bg-gray-50 whitespace-nowrap"
          >
            重置
          </button>
          <button
              id="searchBtn"
              class="px-6 py-2 bg-primary text-white text-sm font-medium !rounded-button hover:bg-blue-600 whitespace-nowrap"
          >
            查询
          </button>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow-sm p-6">
        <div class="flex justify-between items-center mb-6">
          <div class="flex items-center space-x-4">
            <div class="text-sm text-gray-600">
              共 <span id="totalCount" class="font-medium text-gray-900">0</span> 条数据
              <span id="selectedInfo" class="ml-4 text-primary hidden">
                已选择 <span id="selectedCount">0</span> 条
              </span>
            </div>
            <button
              id="batchGeneratePdfBtn"
              class="flex items-center px-4 py-2 bg-red-600 text-white text-sm font-medium !rounded-button hover:bg-red-700 whitespace-nowrap disabled:opacity-50 disabled:cursor-not-allowed hidden"
              disabled
            >
              <i class="fas fa-file-pdf mr-2"></i>批量生成PDF
            </button>
            <button
              id="batchDownloadPdfBtn"
              class="flex items-center px-4 py-2 bg-orange-600 text-white text-sm font-medium !rounded-button hover:bg-orange-700 whitespace-nowrap disabled:opacity-50 disabled:cursor-not-allowed hidden"
              disabled
            >
              <i class="fas fa-download mr-2"></i>批量下载PDF
            </button>
            <button
              id="batchDeleteBtn"
              class="flex items-center px-4 py-2 bg-gray-600 text-white text-sm font-medium !rounded-button hover:bg-gray-700 whitespace-nowrap disabled:opacity-50 disabled:cursor-not-allowed hidden"
              disabled
            >
              <i class="fas fa-trash mr-2"></i>批量删除
            </button>
          </div>
          <div class="flex items-center space-x-4">
            <button
              id="downloadAllPdfBtn"
              class="flex items-center px-4 py-2 bg-indigo-600 text-white text-sm font-medium !rounded-button hover:bg-indigo-700 whitespace-nowrap"
            >
              <i class="fas fa-cloud-download-alt mr-2"></i>全部下载PDF
            </button>
            <button
              id="refreshBtn"
              class="flex items-center px-4 py-2 border border-gray-300 text-gray-700 text-sm font-medium !rounded-button hover:bg-gray-50 whitespace-nowrap"
            >
              <i class="fas fa-sync-alt mr-2"></i>刷新
            </button>
          </div>
        </div>

        <div class="table-wrapper">
          <div class="table-scroll">
            <table class="fixed-table">
              <thead>
                <tr>
                  <th class="border-b text-sm font-medium text-gray-600 w-[60px]">
                  <input
                    type="checkbox"
                      id="selectAll"
                      class="rounded border-gray-300 text-primary focus:ring-primary cursor-pointer"
                  />
                </th>
                  <th class="border-b text-left text-sm font-medium text-gray-600">使用模板</th>
                  <th class="border-b text-left text-sm font-medium text-gray-600">店铺类型</th>
                  <th class="border-b text-left text-sm font-medium text-gray-600">授权主体</th>
                  <th class="border-b text-left text-sm font-medium text-gray-600">授权平台</th>
                  <th class="border-b text-left text-sm font-medium text-gray-600">授权品牌</th>
                  <th class="border-b text-left text-sm font-medium text-gray-600">品牌商标号</th>
                  <th class="border-b text-left text-sm font-medium text-gray-600">店铺名称</th>
                  <th class="border-b text-left text-sm font-medium text-gray-600">店铺ID</th>
                  <th class="border-b text-left text-sm font-medium text-gray-600">所属分公司</th>
                  <th class="border-b text-left text-sm font-medium text-gray-600">授权期间</th>
                  <th class="border-b text-left text-sm font-medium text-gray-600">授权字号</th>
                  <th class="border-b text-left text-sm font-medium text-gray-600">授权方（盖章）主体</th>
                  <th class="border-b text-left text-sm font-medium text-gray-600">用印时间</th>
                  <th class="border-b text-left text-sm font-medium text-gray-600 w-[200px]">操作</th>
              </tr>
            </thead>
              <tbody id="tableBody">
                <tr>
                  <td colspan="15" class="px-4 py-8 text-center text-gray-500">
                    <i class="fas fa-spinner fa-spin mr-2"></i>加载中...
                </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="flex justify-between items-center mt-6">
          <div class="flex items-center space-x-4">
            <span class="text-sm text-gray-700">每页显示</span>
            <select
              id="pageSizeSelect"
              class="px-3 py-2 border border-gray-300 text-gray-700 text-sm !rounded-button custom-select focus:border-primary focus:ring-1 focus:ring-primary"
            >
              <option value="10">10 条</option>
              <option value="20">20 条</option>
              <option value="50">50 条</option>
              <option value="100">100 条</option>
            </select>
          </div>
          <div id="pagination" class="flex items-center space-x-2"></div>
        </div>
      </div>
    </div>

    <!-- 确认对话框模态框 -->
    <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
      <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
        <div class="p-6 border-b border-gray-200">
                  <div class="flex items-center space-x-3">
            <div id="confirmIcon" class="flex-shrink-0">
              <i class="fas fa-exclamation-circle text-3xl text-yellow-500"></i>
            </div>
            <h2 id="confirmTitle" class="text-xl font-bold text-gray-900">确认操作</h2>
          </div>
        </div>
        
        <div class="p-6">
          <p id="confirmMessage" class="text-gray-700 text-base leading-relaxed"></p>
        </div>
        
        <div class="flex justify-end space-x-4 px-6 py-4 bg-gray-50 rounded-b-lg">
          <button
            type="button"
            id="confirmCancelBtn"
            class="px-6 py-2 border border-gray-300 text-gray-700 text-sm font-medium !rounded-button hover:bg-gray-100"
          >
            取消
                    </button>
          <button
            type="button"
            id="confirmOkBtn"
            class="px-6 py-2 bg-red-500 text-white text-sm font-medium !rounded-button hover:bg-red-600"
          >
            确定
                    </button>
                  </div>
      </div>
    </div>

    <!-- 编辑记录模态框 -->
    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
      <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full mx-4 max-h-[90vh] overflow-y-auto">
        <div class="p-6 border-b border-gray-200">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold text-gray-900">编辑记录</h2>
            <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600">
              <i class="fas fa-times text-xl"></i>
            </button>
          </div>
        </div>
        
        <form id="editForm" class="p-6">
          <input type="hidden" id="edit_id" />
          
          <div class="grid grid-cols-2 gap-6">
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">使用模板</label>
                  <input
                type="text"
                id="edit_template_used"
                class="w-full px-4 py-2 border border-gray-300 text-gray-900 text-sm !rounded-button focus:border-primary focus:ring-1 focus:ring-primary"
              />
                  </div>
            
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">店铺类型</label>
                  <input
                type="text"
                id="edit_store_type"
                class="w-full px-4 py-2 border border-gray-300 text-gray-900 text-sm !rounded-button focus:border-primary focus:ring-1 focus:ring-primary"
              />
                  </div>
            
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">授权主体</label>
              <input
                type="text"
                id="edit_authorized_entity"
                class="w-full px-4 py-2 border border-gray-300 text-gray-900 text-sm !rounded-button focus:border-primary focus:ring-1 focus:ring-primary"
              />
        </div>

            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">授权平台</label>
              <input
                type="text"
                id="edit_platform"
                class="w-full px-4 py-2 border border-gray-300 text-gray-900 text-sm !rounded-button focus:border-primary focus:ring-1 focus:ring-primary"
              />
          </div>
            
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">授权品牌</label>
              <input
                type="text"
                id="edit_brand"
                class="w-full px-4 py-2 border border-gray-300 text-gray-900 text-sm !rounded-button focus:border-primary focus:ring-1 focus:ring-primary"
              />
            </div>
            
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">品牌商标号</label>
              <input
                type="text"
                id="edit_trademark_no"
                class="w-full px-4 py-2 border border-gray-300 text-gray-900 text-sm !rounded-button focus:border-primary focus:ring-1 focus:ring-primary"
              />
            </div>
            
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">店铺名称</label>
              <input
                type="text"
                id="edit_store_name"
                class="w-full px-4 py-2 border border-gray-300 text-gray-900 text-sm !rounded-button focus:border-primary focus:ring-1 focus:ring-primary"
              />
            </div>
            
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">店铺ID</label>
              <input
                type="text"
                id="edit_store_id"
                class="w-full px-4 py-2 border border-gray-300 text-gray-900 text-sm !rounded-button focus:border-primary focus:ring-1 focus:ring-primary"
              />
            </div>
            
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">所属分公司</label>
              <input
                type="text"
                id="edit_subsidiary"
                class="w-full px-4 py-2 border border-gray-300 text-gray-900 text-sm !rounded-button focus:border-primary focus:ring-1 focus:ring-primary"
              />
            </div>
            
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">授权期间</label>
              <input
                type="text"
                id="edit_period"
                class="w-full px-4 py-2 border border-gray-300 text-gray-900 text-sm !rounded-button focus:border-primary focus:ring-1 focus:ring-primary"
              />
            </div>
            
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">授权字号</label>
              <input
                type="text"
                id="edit_auth_number"
                class="w-full px-4 py-2 border border-gray-300 text-gray-900 text-sm !rounded-button focus:border-primary focus:ring-1 focus:ring-primary"
              />
            </div>
            
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">授权方（盖章）主体</label>
              <input
                type="text"
                id="edit_stamping_entity"
                class="w-full px-4 py-2 border border-gray-300 text-gray-900 text-sm !rounded-button focus:border-primary focus:ring-1 focus:ring-primary"
              />
            </div>
            
            <div class="space-y-2">
              <label class="block text-sm font-medium text-gray-700">用印时间</label>
              <input
                type="text"
                id="edit_stamping_date"
                class="w-full px-4 py-2 border border-gray-300 text-gray-900 text-sm !rounded-button focus:border-primary focus:ring-1 focus:ring-primary"
              />
            </div>
          </div>
          
          <div class="flex justify-end space-x-4 mt-6 pt-6 border-t border-gray-200">
              <button
              type="button"
              id="cancelEditBtn"
              class="px-6 py-2 border border-gray-300 text-gray-700 text-sm font-medium !rounded-button hover:bg-gray-50"
              >
              取消
              </button>
              <button
              type="submit"
              id="saveEditBtn"
              class="px-6 py-2 bg-primary text-white text-sm font-medium !rounded-button hover:bg-blue-600"
              >
              保存
              </button>
          </div>
        </form>
      </div>
    </div>

    <!-- 进度弹窗 -->
    <div id="progressModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
      <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
        <div class="p-6 border-b border-gray-200">
          <h2 class="text-xl font-bold text-gray-900">
            <i class="fas fa-spinner fa-spin mr-2 text-primary"></i>
            <span id="progressTitle">正在处理...</span>
          </h2>
        </div>
        
        <div class="p-6">
          <div class="mb-4">
            <div class="flex justify-between text-sm text-gray-600 mb-2">
              <span id="progressMessage">准备中...</span>
              <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3">
              <div id="progressBar" class="bg-primary h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>
          
          <div class="text-sm text-gray-500" id="progressDetail">
            <span id="progressCurrent">0</span> / <span id="progressTotal">0</span>
          </div>
        </div>
        
        <div class="flex justify-end space-x-4 px-6 py-4 bg-gray-50 rounded-b-lg">
          <button
            type="button"
            id="progressCancelBtn"
            class="px-6 py-2 border border-gray-300 text-gray-700 text-sm font-medium !rounded-button hover:bg-gray-100"
            disabled
          >
            后台运行
          </button>
        </div>
      </div>
    </div>

    <script>
      let currentPage = 1;
      let pageSize = 10;
      let totalCount = 0;
      let filters = {};

      // 初始化
      document.addEventListener('DOMContentLoaded', () => {
        loadFilters();
        loadData();
        
        // 绑定事件
        document.getElementById('toggleFilterBtn').addEventListener('click', toggleFilter);
        document.getElementById('searchBtn').addEventListener('click', () => {
          currentPage = 1;
          loadData();
        });
        document.getElementById('resetBtn').addEventListener('click', resetFilters);
        document.getElementById('refreshBtn').addEventListener('click', () => loadData());
        document.getElementById('downloadAllPdfBtn').addEventListener('click', downloadAllFilteredPDF);
        document.getElementById('pageSizeSelect').addEventListener('change', (e) => {
          pageSize = parseInt(e.target.value);
          currentPage = 1;
          loadData();
        });
        
        // 全选/取消全选
        document.getElementById('selectAll').addEventListener('change', (e) => {
          const checkboxes = document.querySelectorAll('.row-checkbox');
          checkboxes.forEach(cb => cb.checked = e.target.checked);
          updateSelectedCount();
        });
        
        // 批量操作
        document.getElementById('batchGeneratePdfBtn').addEventListener('click', batchGeneratePDFDocuments);
        document.getElementById('batchDownloadPdfBtn').addEventListener('click', () => batchDownloadDocuments('pdf'));
        document.getElementById('batchDeleteBtn').addEventListener('click', batchDeleteRecords);
        
        // 模态框事件
        document.getElementById('closeModalBtn').addEventListener('click', closeEditModal);
        document.getElementById('cancelEditBtn').addEventListener('click', closeEditModal);
        document.getElementById('editForm').addEventListener('submit', saveEdit);
        
        // 点击模态框背景关闭
        document.getElementById('editModal').addEventListener('click', (e) => {
          if (e.target.id === 'editModal') {
            closeEditModal();
          }
        });

      /**
       * 轮询任务状态
       */
      async function pollTaskStatus(taskId, onComplete) {
        const maxPolls = 600; // 最多轮询10分钟
        let pollCount = 0;
        
        const poll = async () => {
          try {
            pollCount++;
            const res = await fetch(`/upload-generated/api/task/${taskId}`);
            const data = await res.json();
            
            if (data.success && data.task) {
              const task = data.task;
              updateProgress(task);
              
              if (task.status === 'completed') {
                hideProgress();
                if (onComplete) {
                  onComplete(task);
                }
                return;
              } else if (task.status === 'failed') {
                hideProgress();
                showToast(task.error || '任务失败', 'error');
                return;
              }
              
              // 继续轮询
              if (pollCount < maxPolls) {
                setTimeout(poll, 1000); // 每秒轮询一次
              } else {
                hideProgress();
                showToast('任务超时，请刷新页面查看结果', 'error');
              }
            } else {
              hideProgress();
              showToast('无法获取任务状态', 'error');
            }
          } catch (err) {
            hideProgress();
            showToast('查询任务状态失败', 'error');
          }
        };
        
        poll();
      }

      // 处理ZIP下载结果（生成成功/失败统计）
      function handleZipDownloadSuccess(result, typeName, totalRequested) {
        window.location.href = `/upload-generated/api/download-zip/${result.zip_filename}`;
        
        let message = `${typeName}文档批量下载成功！`;
        const details = [];
        
        if (result.generated_count > 0) {
          details.push(`新生成 ${result.generated_count} 个`);
        }
        if (result.existed_count > 0) {
          details.push(`已存在 ${result.existed_count} 个`);
        }
        if (result.failed_count > 0) {
          details.push(`失败 ${result.failed_count} 个`);
        }
        
        if (details.length > 0) {
          message += `（${details.join('，')}）`;
        }
        
        showToast(message, 'success');
        
        const total = (typeof totalRequested === 'number' && !Number.isNaN(totalRequested))
          ? totalRequested
          : (result.total_count || 0) + (result.failed_count || 0);
        
        if (result.generated_count > 0 || result.failed_count > 0) {
          let summary = `共处理 ${total} 个文件：\n✓ 成功下载 ${result.total_count} 个\n`;
          if (result.generated_count > 0) {
            summary += `✓ 新生成 ${result.generated_count} 个\n`;
          }
          if (result.existed_count > 0) {
            summary += `✓ 已存在 ${result.existed_count} 个\n`;
          }
          if (result.failed_count > 0) {
            summary += `✗ 失败 ${result.failed_count} 个`;
          }
          
          setTimeout(() => {
            showConfirm({
              title: '批量下载完成',
              message: summary.trim(),
              type: 'info',
              okText: '知道了',
              cancelText: ''
            });
          }, 1000);
        }
      }

      // 显示自定义确认对话框
      function showConfirm(options) {
        return new Promise((resolve) => {
          const modal = document.getElementById('confirmModal');
          const title = document.getElementById('confirmTitle');
          const message = document.getElementById('confirmMessage');
          const icon = document.getElementById('confirmIcon');
          const okBtn = document.getElementById('confirmOkBtn');
          const cancelBtn = document.getElementById('confirmCancelBtn');
          
          // 设置内容
          title.textContent = options.title || '确认操作';
          message.textContent = options.message || '确定要执行此操作吗？';
          okBtn.textContent = options.okText || '确定';
          
          // 如果cancelText为空字符串，则隐藏取消按钮
          if (options.cancelText === '') {
            cancelBtn.style.display = 'none';
          } else {
            cancelBtn.style.display = 'block';
            cancelBtn.textContent = options.cancelText || '取消';
          }
          
          // 设置图标和按钮样式
          const iconClass = options.type === 'danger' ? 'fa-exclamation-triangle text-red-500' :
                           options.type === 'warning' ? 'fa-exclamation-circle text-yellow-500' :
                           options.type === 'info' ? 'fa-info-circle text-blue-500' :
                           'fa-question-circle text-gray-500';
          
          const btnClass = options.type === 'danger' ? 'bg-red-500 hover:bg-red-600' :
                          options.type === 'warning' ? 'bg-yellow-500 hover:bg-yellow-600' :
                          options.type === 'info' ? 'bg-blue-500 hover:bg-blue-600' :
                          'bg-primary hover:bg-blue-600';
          
          icon.innerHTML = `<i class="fas ${iconClass} text-3xl"></i>`;
          okBtn.className = `px-6 py-2 ${btnClass} text-white text-sm font-medium !rounded-button`;
          
          // 显示模态框
          modal.classList.remove('hidden');
          
          // 处理确认
          const handleOk = () => {
            cleanup();
            resolve(true);
          };
          
          // 处理取消
          const handleCancel = () => {
            cleanup();
            resolve(false);
          };
          
          // 清理事件监听
          const cleanup = () => {
            modal.classList.add('hidden');
            okBtn.removeEventListener('click', handleOk);
            cancelBtn.removeEventListener('click', handleCancel);
            modal.removeEventListener('click', handleBackgroundClick);
          };
          
          // 点击背景关闭
          const handleBackgroundClick = (e) => {
            if (e.target.id === 'confirmModal') {
              handleCancel();
            }
          };
          
          // 绑定事件
          okBtn.addEventListener('click', handleOk);
          cancelBtn.addEventListener('click', handleCancel);
          modal.addEventListener('click', handleBackgroundClick);
        });
      }

            loadData(); // 重新加载列表
          } else {
            showToast(data.message || '删除失败', 'error');
          }
        } catch (err) {
          showToast('网络错误，删除失败', 'error');
          console.error('删除记录失败:', err);
        }
      }
      
      // 批量删除记录
      async function batchDeleteRecords() {
        const checkboxes = document.querySelectorAll('.row-checkbox:checked');
        const ids = Array.from(checkboxes).map(cb => parseInt(cb.getAttribute('data-id')));
        
        if (ids.length === 0) {
          showToast('请选择要删除的数据', 'error');
          return;
        }
        
        const confirmed = await showConfirm({
          title: '批量删除确认',
          message: `确定要删除选中的 ${ids.length} 条记录吗？删除后将无法恢复！`,
          type: 'danger',
          okText: '删除',
          cancelText: '取消'
        });
        
        if (!confirmed) {
          return;
        }
        
        try {
          // 显示进度弹窗
          showProgress('批量删除记录');
          
          // 批量删除 - 使用Promise.all并行删除以提高效率
          const total = ids.length;
          let completed = 0;
          
          // 创建所有删除请求
          const deletePromises = ids.map(async (id, index) => {
            try {
              const res = await fetch(`/upload-generated/api/record/${id}`, {
                method: 'DELETE'
              });
              const data = await res.json();
              
              // 更新进度
              completed++;
              updateProgress({
                progress: Math.round((completed / total) * 100),
                current: completed,
                total: total,
                message: `正在删除记录... (${completed}/${total})`
              });
              
              return { success: data.success, id, message: data.message };
            } catch (err) {
              completed++;
              updateProgress({
                progress: Math.round((completed / total) * 100),
                current: completed,
                total: total,
                message: `正在删除记录... (${completed}/${total})`
              });
              return { success: false, id, message: err.message };
            }
          });
          
          // 等待所有删除操作完成
          const results = await Promise.all(deletePromises);
          
          // 统计结果
          const successCount = results.filter(r => r.success).length;
          const failedCount = results.filter(r => !r.success).length;
          
          // 隐藏进度弹窗
          hideProgress();
          
          // 显示结果
          if (failedCount === 0) {
            showToast(`成功删除 ${successCount} 条记录！`, 'success');
          } else {
            showToast(`删除完成：成功 ${successCount} 条，失败 ${failedCount} 条`, failedCount === total ? 'error' : 'success');
          }
          
          // 重新加载列表
          loadData();
        } catch (err) {
          hideProgress();
          showToast('网络错误，批量删除失败', 'error');
          console.error('批量删除失败:', err);
        }
      }

      function toggleFilter() {
        const section = document.getElementById('filterSection');
        section.classList.toggle('hidden');
      }

      async function loadFilters() {
        try {
          const res = await fetch('/upload-generated/api/filters');
          const data = await res.json();
          if (data.success) {
            filters = data.filters;
            populateFilterOptions();
          }
        } catch (err) {
          console.error('加载筛选器失败:', err);
        }
      }

      function populateFilterOptions() {
        // 填充下拉选项
        const selects = {
          filter_template: filters.templates || [],
          filter_store_type: filters.store_types || [],
          filter_entity: filters.entities || [],
          filter_platform: filters.platforms || [],
          filter_brand: filters.brands || [],
          filter_stamping_entity: filters.stamping_entities || []
        };

        for (const [id, options] of Object.entries(selects)) {
          const select = document.getElementById(id);
          if (select) {
            options.forEach(opt => {
              const option = document.createElement('option');
              option.value = opt;
              option.textContent = opt;
              select.appendChild(option);
            });
          }
        }
      }

      function getFilterParams() {
        return {
          template_used: document.getElementById('filter_template')?.value || '',
          store_type: document.getElementById('filter_store_type')?.value || '',
          authorized_entity: document.getElementById('filter_entity')?.value || '',
          platform: document.getElementById('filter_platform')?.value || '',
          brand: document.getElementById('filter_brand')?.value || '',
          store_name: document.getElementById('filter_store_name')?.value || '',
          auth_number: document.getElementById('filter_auth_number')?.value || '',
          stamping_entity: document.getElementById('filter_stamping_entity')?.value || ''
        };
      }

      function resetFilters() {
        document.getElementById('filter_template').value = '';
        document.getElementById('filter_store_type').value = '';
        document.getElementById('filter_entity').value = '';
        document.getElementById('filter_platform').value = '';
        document.getElementById('filter_brand').value = '';
        document.getElementById('filter_store_name').value = '';
        document.getElementById('filter_auth_number').value = '';
        document.getElementById('filter_stamping_entity').value = '';
        currentPage = 1;
        loadData();
      }

      async function loadData() {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '<tr><td colspan="15" class="text-center text-gray-500" style="padding: 32px 16px;"><i class="fas fa-spinner fa-spin mr-2"></i>加载中...</td></tr>';

        try {
          const params = new URLSearchParams({
            page: currentPage,
            page_size: pageSize,
            ...getFilterParams()
          });

          const res = await fetch(`/upload-generated/api/list?${params}`);
          const data = await res.json();

          if (data.success) {
            totalCount = data.total;
            renderTable(data.data);
            renderPagination(data.total_pages);
            document.getElementById('totalCount').textContent = totalCount;
          } else {
            tableBody.innerHTML = `<tr><td colspan="15" class="text-center text-red-500" style="padding: 32px 16px;">${data.message || '加载失败'}</td></tr>`;
          }
        } catch (err) {
          tableBody.innerHTML = '<tr><td colspan="15" class="text-center text-red-500" style="padding: 32px 16px;">网络错误，加载失败</td></tr>';
          console.error('加载数据失败:', err);
        }
      }

      function renderTable(items) {
        const tableBody = document.getElementById('tableBody');
        
        if (!items || items.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="15" class="text-center text-gray-500" style="padding: 32px 16px;">暂无数据</td></tr>';
          return;
        }

        tableBody.innerHTML = items.map(item => `
          <tr class="border-b">
            <td>
              <input
                type="checkbox"
                class="row-checkbox rounded border-gray-300 text-primary focus:ring-primary cursor-pointer"
                data-id="${item.id}"
              />
            </td>
            <td class="text-sm text-gray-900">${item.template_used || '-'}</td>
            <td class="text-sm text-gray-900">${item.store_type || '-'}</td>
            <td class="text-sm text-gray-900">${item.authorized_entity || '-'}</td>
            <td class="text-sm text-gray-900">${item.platform || '-'}</td>
            <td class="text-sm text-gray-900">${item.brand || '-'}</td>
            <td class="text-sm text-gray-900">${item.trademark_no || '-'}</td>
            <td class="text-sm text-gray-900">${item.store_name || '-'}</td>
            <td class="text-sm text-gray-900">${item.store_id || '-'}</td>
            <td class="text-sm text-gray-900">${item.subsidiary || '-'}</td>
            <td class="text-sm text-gray-900">${item.period || '-'}</td>
            <td class="text-sm text-gray-900">${item.auth_number || '-'}</td>
            <td class="text-sm text-gray-900">${item.stamping_entity || '-'}</td>
            <td class="text-sm text-gray-900">${item.stamping_date || '-'}</td>
            <td>
              <div class="flex items-center space-x-2">
              <button
                  class="generate-only-pdf-btn text-blue-600 hover:text-blue-700 text-sm font-medium whitespace-nowrap"
                  data-id="${item.id}"
                  title="仅生成PDF文档"
              >
                  <i class="fas fa-cog mr-1"></i>生成
              </button>
              <button
                  class="generate-pdf-btn text-red-600 hover:text-red-700 text-sm font-medium whitespace-nowrap"
                  data-id="${item.id}"
                  title="生成并下载PDF文档"
              >
                  <i class="fas fa-download mr-1"></i>下载
              </button>
              <button
                  class="preview-pdf-btn text-green-600 hover:text-green-700 text-sm font-medium whitespace-nowrap"
                  data-id="${item.id}"
                  title="预览PDF"
              >
                  <i class="fas fa-eye mr-1"></i>预览
              </button>
              <button
                  class="edit-btn text-yellow-600 hover:text-yellow-700 text-sm font-medium whitespace-nowrap"
                  data-id="${item.id}"
                  title="编辑记录"
                >
                  <i class="fas fa-edit mr-1"></i>编辑
                </button>
                <button
                  class="delete-btn text-gray-600 hover:text-red-700 text-sm font-medium whitespace-nowrap"
                  data-id="${item.id}"
                  title="删除记录"
                >
                  <i class="fas fa-trash mr-1"></i>删除
              </button>
            </div>
            </td>
          </tr>
        `).join('');
        
        // 绑定仅生成PDF按钮事件（不下载）
        document.querySelectorAll('.generate-only-pdf-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const id = e.currentTarget.getAttribute('data-id');
            generateOnlyPDF(id);
          });
        });
        
        // 绑定生成并下载PDF按钮事件
        document.querySelectorAll('.generate-pdf-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const id = e.currentTarget.getAttribute('data-id');
            generatePDFDocument(id);
          });
        });
        
        // 绑定预览PDF按钮事件
        document.querySelectorAll('.preview-pdf-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const id = e.currentTarget.getAttribute('data-id');
            previewPDF(id);
          });
        });
        
        // 绑定编辑按钮事件
        document.querySelectorAll('.edit-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.currentTarget.getAttribute('data-id');
            openEditModal(id);
          });
        });
        
        // 绑定删除按钮事件
        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.currentTarget.getAttribute('data-id');
            deleteRecord(id);
          });
        });
        
        // 绑定复选框事件
        document.querySelectorAll('.row-checkbox').forEach(checkbox => {
          checkbox.addEventListener('change', updateSelectedCount);
        });
      }

      function renderPagination(totalPages) {
        const paginationEl = document.getElementById('pagination');
        paginationEl.innerHTML = '';

        if (totalPages <= 1) return;

        const makeBtn = (label, page, active = false, disabled = false) => {
          const btn = document.createElement('button');
          btn.className = `px-3 py-2 text-sm font-medium !rounded-button ${
            active 
              ? 'bg-primary text-white' 
              : 'border border-gray-300 text-gray-700 hover:bg-gray-50'
          } ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`;
          btn.textContent = label;
          btn.disabled = disabled;
          if (!disabled && !active) {
            btn.addEventListener('click', () => {
              currentPage = page;
              loadData();
            });
          }
          return btn;
        };

        // 上一页
        paginationEl.appendChild(makeBtn('上一页', currentPage - 1, false, currentPage === 1));

        // 页码
        const maxButtons = 7;
        let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
        let endPage = Math.min(totalPages, startPage + maxButtons - 1);

        if (endPage - startPage < maxButtons - 1) {
          startPage = Math.max(1, endPage - maxButtons + 1);
        }

        if (startPage > 1) {
          paginationEl.appendChild(makeBtn('1', 1));
          if (startPage > 2) {
            const span = document.createElement('span');
            span.className = 'px-2 text-gray-500';
            span.textContent = '...';
            paginationEl.appendChild(span);
          }
        }

        for (let i = startPage; i <= endPage; i++) {
          paginationEl.appendChild(makeBtn(String(i), i, i === currentPage));
        }

        if (endPage < totalPages) {
          if (endPage < totalPages - 1) {
            const span = document.createElement('span');
            span.className = 'px-2 text-gray-500';
            span.textContent = '...';
            paginationEl.appendChild(span);
          }
          paginationEl.appendChild(makeBtn(String(totalPages), totalPages));
        }

        // 下一页
        paginationEl.appendChild(makeBtn('下一页', currentPage + 1, false, currentPage === totalPages));
      }
    </script>
  </body>
