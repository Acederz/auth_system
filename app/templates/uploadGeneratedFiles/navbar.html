<!-- 顶部导航栏组件 -->
<nav class="bg-white shadow-sm border-b border-gray-200">

      <div class="flex items-center space-x-8">
        <a href="{{ url_for('upload_generated.menu_page') }}" class="text-xl font-bold text-gray-900 hover:text-primary transition-colors">

        </a>
        <div class="hidden md:flex items-center space-x-4">

          </a>
          <a href="{{ url_for('upload_generated.import_page') }}" 
             class="{% if active_page == 'import' %}text-primary border-b-2 border-primary{% else %}text-gray-600 hover:text-primary transition-colors{% endif %} px-3 py-2 {% if active_page != 'import' %}rounded-md{% endif %} text-sm font-medium">
            <i class="fas fa-file-import mr-1"></i>数据导入
          </a>
          {% endif %}
          <a href="{{ url_for('upload_generated.list_page') }}" 
             class="{% if active_page == 'list' %}text-primary border-b-2 border-primary{% else %}text-gray-600 hover:text-primary transition-colors{% endif %} px-3 py-2 {% if active_page != 'list' %}rounded-md{% endif %} text-sm font-medium">
            <i class="fas fa-list mr-1"></i>数据列表
          </a>
          {% if session.role == 'generate_admin' %}
          <a href="{{ url_for('upload_generated.user_management_page') }}" 
             class="{% if active_page == 'user_management' %}text-primary border-b-2 border-primary{% else %}text-gray-600 hover:text-primary transition-colors{% endif %} px-3 py-2 {% if active_page != 'user_management' %}rounded-md{% endif %} text-sm font-medium">

        </a> -->

        </a>
      </div>
